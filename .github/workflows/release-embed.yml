name: Embed release

on:
  push:
    branches:
      - main
    paths:
      - "site/embed-entry.ts"
      - "site/embed-public.d.ts"
      - "site/components/reusable/embed-*.ts"
      - "docs/EMBEDDING.md"
      - "tests/embed-release-contract.test.mjs"
      - "package.json"
      - ".github/workflows/release-embed.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'xtreemze/timeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:embed-release
      - run: pnpm build
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            requested_version="${GITHUB_REF_NAME#v}"
            test "$requested_version" = "$package_version"
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"
      - name: Skip an already published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble embed SDK
        if: steps.existing.outputs.published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          stage="release/luum-embed-$VERSION"
          mkdir -p "$stage"
          cp dist/embed/luum-embed.js "$stage/luum-embed.js"
          cp site/embed-public.d.ts "$stage/luum-embed.d.ts"
          cp docs/EMBEDDING.md "$stage/README.md"
          (
            cd "$stage"
            sha256sum luum-embed.js luum-embed.d.ts README.md > SHA256SUMS
          )
          tar -C release -czf "release/luum-embed-$VERSION.tar.gz" "luum-embed-$VERSION"
          (
            cd release
            zip -qr "luum-embed-$VERSION.zip" "luum-embed-$VERSION"
          )
      - name: Publish GitHub release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          gh release create "$TAG"             "release/luum-embed-$VERSION.zip"             "release/luum-embed-$VERSION.tar.gz"             --target "$GITHUB_SHA"             --title "Lūm $TAG — Embed SDK"             --notes-file docs/EMBEDDING.md
