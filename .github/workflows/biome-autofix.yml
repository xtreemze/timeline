name: Biome autofix

on:
  push:
    branches:
      - chore/strict-biome-quality-gate

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/strict-biome-quality-gate

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply safe Biome fixes
        run: pnpm exec biome check --write . || true

      - name: Commit deterministic fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply strict Biome safe fixes"
          git push
