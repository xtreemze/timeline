name: Temporary force validation

on:
  push:
    branches:
      - perf/force-rendering-interactions

permissions:
  contents: read

jobs:
  validate-force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file quality
        run: pnpm check:quality
      - name: Run focused force tests
        run: |
          pnpm test:reference-world-force-simulation
          pnpm test:world-force-layout
          node --test tests/world-view-controller.test.mjs
      - name: Run world-force benchmark
        run: pnpm benchmark:world-force
