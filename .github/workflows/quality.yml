name: Code quality

on:
  pull_request:
    paths:
      - ".github/workflows/quality.yml"
      - ".editorconfig"
      - ".vscode/settings.json"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "site/**"
      - "tests/**"
      - "scripts/**"
      - "benchmarks/**"
      - "*.js"
      - "*.mjs"
      - "*.ts"
      - "*.json"
      - "*.css"
  push:
    branches: [main]
    paths:
      - ".github/workflows/quality.yml"
      - ".editorconfig"
      - ".vscode/settings.json"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "site/**"
      - "tests/**"
      - "scripts/**"
      - "benchmarks/**"
      - "*.js"
      - "*.mjs"
      - "*.ts"
      - "*.json"
      - "*.css"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce lint, style, formatting, and architecture policy
        run: pnpm lint
