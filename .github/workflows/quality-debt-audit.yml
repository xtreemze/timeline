name: Quality debt audit
# Strict debt measurement after mechanical formatting.

on:
  push:
    branches:
      - chore/quality-debt-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Verify repository formatting
        run: pnpm format:check
      - name: Audit strict CSS
        run: pnpm lint:styles
