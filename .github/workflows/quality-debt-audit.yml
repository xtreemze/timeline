name: Quality debt audit
# Temporary cleanup validation. Remove before merging the cleanup branch.

on:
  push:
    branches:
      - chore/quality-debt-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Verify repository formatting
        run: pnpm format:check
      - name: Audit strict CSS
        run: pnpm lint:styles
      - name: Run full lint stack
        run: pnpm lint
      - name: Enforce architecture types
        run: pnpm types:architecture
      - name: Validate focused cleanup contracts
        run: >-
          node --test
          tests/quality-tooling-policy.test.mjs
          tests/timeline-motion-popover-regression.test.mjs
          tests/event-focus-form.test.mjs
          tests/timeline-view-geometry.test.mjs
          tests/browser-certification-config.test.mjs
      - name: Run architecture suite
        run: pnpm test:architecture
      - name: Build production site
        run: pnpm build
