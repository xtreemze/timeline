name: E2E media showcase

on:
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'playwright.highlight.config.ts'
      - 'tests/highlight/**'
      - 'scripts/render-e2e-highlight.mjs'
      - 'tests/playwright-certification-config.test.mjs'
      - 'docs/E2E-HIGHLIGHT-REEL.md'
      - 'docs/FORMAL-PRESENTATION.md'
      - 'README.md'
      - '.github/workflows/e2e-media.yml'
      - '.github/xorg-dummy-60.conf'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'playwright.highlight.config.ts'
      - 'tests/highlight/**'
      - 'scripts/render-e2e-highlight.mjs'
      - 'tests/playwright-certification-config.test.mjs'
      - 'docs/E2E-HIGHLIGHT-REEL.md'
      - 'docs/FORMAL-PRESENTATION.md'
      - 'README.md'
      - '.github/workflows/e2e-media.yml'
      - '.github/xorg-dummy-60.conf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: e2e-media-${{ github.event.pull_request.number || github.ref }}
  # Cancel stale PR evidence, but never cancel the active main run that Pages depends on.
  # GitHub still keeps only the newest pending run in this concurrency group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify media-pipeline configuration
        run: pnpm test:browser-certification-config

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install capture runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xserver-xorg-core xserver-xorg-video-dummy x11-utils x11-xserver-utils

      - name: Start native 60 Hz virtual display
        run: |
          sudo Xorg :99 -ac -noreset -nolisten tcp -config "$GITHUB_WORKSPACE/.github/xorg-dummy-60.conf" >"$RUNNER_TEMP/xorg-showcase.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          DISPLAY=:99 xdpyinfo >/dev/null
          DISPLAY=:99 xrandr --current
          DISPLAY=:99 xrandr --current | grep -E '1920x1080_60\.00.*60\.00\*'
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "SHOWCASE_X11_WIDTH=1920" >> "$GITHUB_ENV"
          echo "SHOWCASE_X11_HEIGHT=1080" >> "$GITHUB_ENV"

      - name: Record source-native showcase media
        run: pnpm test:e2e:showcase

      - name: Render desktop and mobile reels and showcase assets
        run: pnpm render:e2e:showcase

      - name: Verify media evidence
        run: |
          test -s artifacts/e2e-media/manifest.json
          test -s artifacts/e2e-media/README-showcase.md
          test -s artifacts/e2e-media/reels/lum-desktop-highlight.mp4
          test -s artifacts/e2e-media/reels/lum-mobile-highlight.mp4
          test "$(find artifacts/e2e-media/raw/desktop -type f -name '*.mkv' | wc -l)" -eq 2
          test "$(find artifacts/e2e-media/raw/mobile -type f -name '*.mkv' | wc -l)" -eq 2
          test "$(find artifacts/e2e-media/raw/desktop -type f -name '*.frames.json' | wc -l)" -eq 2
          test "$(find artifacts/e2e-media/raw/mobile -type f -name '*.frames.json' | wc -l)" -eq 2
          test "$(find artifacts/e2e-media/raw/desktop -type f -name '*.png' | wc -l)" -eq 5
          test "$(find artifacts/e2e-media/raw/mobile -type f -name '*.png' | wc -l)" -eq 5
          test "$(find artifacts/e2e-media/showcase/desktop -type f -name '*.webp' | wc -l)" -eq 2
          test "$(find artifacts/e2e-media/showcase/mobile -type f -name '*.webp' | wc -l)" -eq 2
          test "$(find artifacts/e2e-media/showcase/desktop -type f -name '*.png' | wc -l)" -eq 3
          test "$(find artifacts/e2e-media/showcase/mobile -type f -name '*.png' | wc -l)" -eq 3

      - name: Report showcase asset sizes
        run: |
          echo "Desktop showcase"
          du -h artifacts/e2e-media/showcase/desktop/*
          du -sh artifacts/e2e-media/showcase/desktop
          echo "Mobile showcase"
          du -h artifacts/e2e-media/showcase/mobile/*
          du -sh artifacts/e2e-media/showcase/mobile
          echo "Combined showcase payload"
          du -sh artifacts/e2e-media/showcase

      - name: Upload E2E media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lum-e2e-showcase
          path: artifacts/e2e-media/
          if-no-files-found: warn
          retention-days: 14
