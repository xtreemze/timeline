name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["E2E media showcase"]
    types: [completed]
  workflow_dispatch:
    inputs:
      media_run_id:
        description: Successful E2E media showcase run ID whose artifact should be published
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download certified showcase media
        uses: actions/download-artifact@v4
        with:
          name: lum-e2e-showcase
          path: artifacts/e2e-media
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.media_run_id }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint code
        run: pnpm lint

      - name: Typecheck migrated TypeScript
        run: pnpm types:migrated

      - name: Enforce architecture TypeScript
        run: pnpm types:architecture

      - name: Build Vite application
        run: |
          pnpm build
          test -s dist/index.html
          test -d dist/assets
          if grep -Eq 'src="[^"]+\.ts([?#][^"]*)?"' dist/index.html; then
            echo "Built entry point still references raw TypeScript modules"
            exit 1
          fi

      - name: Validate architecture tests
        run: pnpm test:architecture

      - name: Run full migrated Node test suite
        run: pnpm test

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Certify built Pages runtime
        run: pnpm exec playwright test --config=playwright.pages.config.ts

      - name: Publish certified showcase GIFs into Pages artifact
        run: |
          test "$(find artifacts/e2e-media/gifs/desktop -type f -name '*.gif' | wc -l)" -eq 5
          test "$(find artifacts/e2e-media/gifs/mobile -type f -name '*.gif' | wc -l)" -eq 5
          mkdir -p dist/showcase/desktop dist/showcase/mobile
          cp artifacts/e2e-media/gifs/desktop/*.gif dist/showcase/desktop/
          cp artifacts/e2e-media/gifs/mobile/*.gif dist/showcase/mobile/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Validate built entry point
        run: |
          test -s dist/index.html
          test -d dist/assets
          test "$(find dist/showcase/desktop -type f -name '*.gif' | wc -l)" -eq 5
          test "$(find dist/showcase/mobile -type f -name '*.gif' | wc -l)" -eq 5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
