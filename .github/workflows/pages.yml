name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native ESM site
        run: |
          pnpm build
          test -s dist/index.html
          test -d dist/assets
          test "$(find dist/assets -type f -name '*.js' | wc -l)" -gt 0
          test "$(find dist/assets -type f | wc -l)" -gt 1
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/pwa-icon-192.png
          test -s dist/pwa-icon-512.png
          test -s dist/pwa-maskable-512.png
          test -s dist/pwa-icon-192.svg
          test -s dist/pwa-icon-512.svg
          test -s dist/pwa-maskable-512.svg
          if grep -Eq 'src="[^"]+\.ts([?#][^"]*)?"' dist/index.html; then
            echo "Built entry point still references raw TypeScript modules"
            exit 1
          fi
          if grep -Eq '(orb-graph|leaflet|evidence-extraction)\.bundle\.js' dist/index.html; then
            echo "Built entry point still references legacy classic bundles"
            exit 1
          fi

      - name: Restore latest showcase media when available
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow e2e-media.yml             --branch main             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No completed showcase run is available; deploying without showcase media."
            exit 0
          fi

          rm -rf artifacts/e2e-media
          gh run download "$run_id"             --repo "$GITHUB_REPOSITORY"             --name lum-e2e-showcase             --dir artifacts/e2e-media

          if [ -d artifacts/e2e-media/showcase ]; then
            rm -rf dist/showcase
            mkdir -p dist/showcase
            cp -R artifacts/e2e-media/showcase/. dist/showcase/
          else
            echo "Latest showcase artifact has no showcase directory; deploying without it."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test coverage report
        continue-on-error: true
        run: pnpm dlx c8@10.1.3 --reporter=html --reporter=lcov --reporter=text-summary pnpm test

      - name: Upload coverage report
        id: upload-coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 2

      - name: Keep only the latest coverage artifact
        continue-on-error: true
        if: ${{ always() && steps.upload-coverage.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
          done < <(
            gh api --paginate "/repos/${REPOSITORY}/actions/artifacts?name=coverage-report&per_page=100"               --jq ".artifacts[] | select((.workflow_run.id // 0) != ${CURRENT_RUN_ID}) | .id"
          )

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lighthouse:
    needs: deploy
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Lighthouse audit
        continue-on-error: true
        env:
          LIGHTHOUSE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p artifacts/lighthouse
          pnpm dlx lighthouse "$LIGHTHOUSE_URL"             --chrome-flags="--headless --no-sandbox"             --output=html             --output-path=artifacts/lighthouse/report.html             --quiet

      - name: Upload Lighthouse report
        id: upload-lighthouse
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: artifacts/lighthouse/
          if-no-files-found: error
          retention-days: 2

      - name: Keep only the latest Lighthouse artifact
        continue-on-error: true
        if: ${{ always() && steps.upload-lighthouse.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
          done < <(
            gh api --paginate "/repos/${REPOSITORY}/actions/artifacts?name=lighthouse-report&per_page=100"               --jq ".artifacts[] | select((.workflow_run.id // 0) != ${CURRENT_RUN_ID}) | .id"
          )
