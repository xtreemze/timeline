name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["E2E media showcase"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native ESM site
        run: |
          pnpm build
          test -s dist/index.html
          test -s dist/lum/index.html
          test -s dist/workspace.html
          test -s dist/presentation.html
          grep -q 'Weave the threads' dist/index.html
          grep -q 'data-site-generator="astro"' dist/index.html
          grep -q 'id="history"' dist/index.html
          grep -q 'id="app-shell"' dist/lum/index.html
          grep -q 'href="./lum/"' dist/index.html
          test -d dist/assets
          test "$(find dist/assets -type f -name '*.js' | wc -l)" -gt 0
          test "$(find dist/assets -type f | wc -l)" -gt 1
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/lum/sw.js
          test -s dist/pwa-icon-192.png
          test -s dist/pwa-icon-512.png
          test -s dist/pwa-maskable-512.png
          test -s dist/pwa-icon-192.svg
          test -s dist/pwa-icon-512.svg
          test -s dist/pwa-maskable-512.svg
          if grep -Eq 'src="[^"]+\.ts([?#][^"]*)?"' dist/index.html dist/lum/index.html; then
            echo "Built entry point still references raw TypeScript modules"
            exit 1
          fi
          if grep -Eq '(orb-graph|leaflet|evidence-extraction)\.bundle\.js' dist/index.html dist/workspace.html; then
            echo "Built entry point still references legacy classic bundles"
            exit 1
          fi

      - name: Restore certified showcase media
        env:
          GH_TOKEN: ${{ github.token }}
          SHOWCASE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail

          run_id="$SHOWCASE_RUN_ID"
          require_current=false
          if [ -n "$run_id" ]; then
            require_current=true
            echo "Using certified showcase artifact from triggering run $run_id."
          else
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow e2e-media.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi

          if [ -z "$run_id" ]; then
            echo "No completed showcase run is available; deploying the Astro application without showcase media."
            exit 0
          fi

          rm -rf artifacts/e2e-media
          mkdir -p artifacts/e2e-media
          if ! gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name lum-e2e-showcase \
            --dir artifacts/e2e-media; then
            if [ "$require_current" = true ]; then
              echo "Successful triggering showcase run $run_id did not expose its certified artifact."
              exit 1
            fi
            echo "Latest certified showcase artifact could not be restored; preserving the application-only Pages build."
            rm -rf artifacts/e2e-media
            exit 0
          fi

          if [ ! -d artifacts/e2e-media/showcase/desktop ] || [ ! -d artifacts/e2e-media/showcase/mobile ]; then
            if [ "$require_current" = true ]; then
              echo "Certified showcase artifact is incomplete: desktop/mobile presentation directories are required."
              exit 1
            fi
            echo "Restored showcase artifact is incomplete; preserving the application-only Pages build."
            exit 0
          fi

          rm -rf dist/showcase
          mkdir -p dist/showcase
          cp -R artifacts/e2e-media/showcase/. dist/showcase/
          test -d dist/showcase/desktop
          test -d dist/showcase/mobile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test coverage report
        continue-on-error: true
        run: pnpm dlx c8@10.1.3 --reporter=html --reporter=lcov --reporter=text-summary pnpm test

      - name: Upload coverage report
        id: upload-coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 2

      - name: Keep only the latest coverage artifact
        continue-on-error: true
        if: ${{ always() && steps.upload-coverage.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
          done < <(
            gh api --paginate "/repos/${REPOSITORY}/actions/artifacts?name=coverage-report&per_page=100"               --jq ".artifacts[] | select((.workflow_run.id // 0) != ${CURRENT_RUN_ID}) | .id"
          )

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deployed-landing:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Certify deployed landing page
        env:
          LANDING_URL: ${{ needs.deploy.outputs.page_url }}
          LUM_URL: "${{ needs.deploy.outputs.page_url }}lum/"
        run: |
          landing="$(curl -fsSL "$LANDING_URL")"
          printf '%s' "$landing" | grep -q 'Weave the threads'
          printf '%s' "$landing" | grep -q 'data-site-generator="astro"'
          printf '%s' "$landing" | grep -q 'href="./lum/"'

          lum="$(curl -fsSL "$LUM_URL")"
          printf '%s' "$lum" | grep -q 'id="app-shell"'

  deployed-world:
    needs: deploy
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Certify deployed WorldSurface
        env:
          LUM_DEPLOYED_URL: "${{ needs.deploy.outputs.page_url }}lum/"
        run: pnpm exec playwright test --config=playwright.deployed.config.ts

  lighthouse:
    needs: deploy
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Lighthouse audit
        continue-on-error: true
        env:
          LIGHTHOUSE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p artifacts/lighthouse
          pnpm dlx lighthouse "$LIGHTHOUSE_URL"             --chrome-flags="--headless --no-sandbox"             --output=html             --output-path=artifacts/lighthouse/report.html             --quiet

      - name: Upload Lighthouse report
        id: upload-lighthouse
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: artifacts/lighthouse/
          if-no-files-found: error
          retention-days: 2

      - name: Keep only the latest Lighthouse artifact
        continue-on-error: true
        if: ${{ always() && steps.upload-lighthouse.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
          done < <(
            gh api --paginate "/repos/${REPOSITORY}/actions/artifacts?name=lighthouse-report&per_page=100"               --jq ".artifacts[] | select((.workflow_run.id // 0) != ${CURRENT_RUN_ID}) | .id"
          )
