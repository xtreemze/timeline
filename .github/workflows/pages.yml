name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "package.json"
      - "jsconfig.json"
      - "tsconfig*.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Architecture type check
        run: pnpm types:architecture

      - name: Migration-wide type inventory
        run: pnpm types || echo "⚠ Existing migration type errors remain; architecture packages are checked separately and fatally."

      - name: Build worker-backed relation graph and site
        run: |
          pnpm build
          test -s site/orb-graph.bundle.js
          test -s site/evidence-extraction.bundle.js
          test -s site/pdf.worker.mjs
          node --check src/orb-graph-entry.js
          node --check src/evidence-extraction-core.js
          node --check src/evidence-extraction-entry.js
          node --check site/orb-graph.bundle.js
          node --check site/evidence-extraction.bundle.js
          test -d dist || echo "⚠ Vite build output not created (expected during Phase 4 migration)"

      - name: Validate JavaScript syntax
        run: |
          find src site tests benchmarks scripts -type f \( -name '*.js' -o -name '*.mjs' \) \
            ! -name 'orb-graph.bundle.js' \
            ! -name 'evidence-extraction.bundle.js' \
            -print0 | while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Validate architecture tests
        run: pnpm test:architecture

      - name: Validate application
        run: pnpm test

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Validate static entry point
        run: test -f site/index.html && test -f site/styles.css && test -f site/icon.svg && test -s site/orb-graph.bundle.js && test -s site/evidence-extraction.bundle.js && test -s site/pdf.worker.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
