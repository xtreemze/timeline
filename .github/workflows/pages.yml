name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "playwright.highlight.config.ts"
      - "playwright.pages.config.ts"
      - "vite.config.ts"
      - "scripts/serve-pages-preview.mjs"
      - "scripts/render-e2e-highlight.mjs"
      - "tests/highlight/**"
      - "tests/playwright/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Lint code
        run: pnpm lint

      - name: Inventory migrated TypeScript
        run: pnpm types:migrated || echo "⚠ Existing TypeScript migration errors remain (ratcheted follow-up)" && true

      - name: Enforce architecture TypeScript
        run: pnpm types:architecture

      - name: Build worker-backed relation graph and site
        run: |
          pnpm build
          test -s site/orb-graph.bundle.js
          test -s site/leaflet.bundle.js
          test -s site/leaflet.css
          test -s site/evidence-extraction.bundle.js
          test -s site/pdf.worker.mjs
          node --check src/orb-graph-entry.js
          node --check src/evidence-extraction-core.js
          node --check src/evidence-extraction-entry.js
          node --check site/orb-graph.bundle.js
          node --check site/evidence-extraction.bundle.js
          test -s dist/index.html
          if grep -Eq 'src="[^"]+\.ts([?#][^"]*)?"' dist/index.html; then
            echo "Built entry point still references raw TypeScript modules"
            exit 1
          fi

      - name: Validate architecture tests
        run: pnpm test:architecture

      - name: Run full migrated Node test suite
        run: pnpm test

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Certify built Pages runtime
        run: pnpm exec playwright test --config=playwright.pages.config.ts

      - name: Record showcase loops in real Chromium
        run: pnpm test:e2e:highlight

      - name: Render five looping showcase GIFs
        run: pnpm render:e2e:highlight

      - name: Publish showcase GIFs into Pages artifact
        run: |
          test "$(find artifacts/e2e-media/gifs -type f -name '*.gif' | wc -l)" -eq 5
          mkdir -p dist/showcase
          cp artifacts/e2e-media/gifs/*.gif dist/showcase/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Validate built entry point
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s dist/orb-graph.bundle.js
          test -s dist/leaflet.bundle.js
          test -s dist/evidence-extraction.bundle.js
          test -s dist/pdf.worker.mjs
          test "$(find dist/showcase -type f -name '*.gif' | wc -l)" -eq 5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
