name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Type check
        run: pnpm types || echo "⚠ Type errors found (non-fatal in Phase 2)" && true

      - name: Build worker-backed relation graph
        run: |
          pnpm build
          test -s site/orb-graph.bundle.js
          test -s site/evidence-extraction.bundle.js
          test -s site/pdf.worker.mjs
          node --check src/orb-graph-entry.js
          node --check src/evidence-extraction-core.js
          node --check src/evidence-extraction-entry.js
          node --check site/orb-graph.bundle.js
          node --check site/evidence-extraction.bundle.js

      - name: Validate application JavaScript
        run: |
          node --check site/time-scale.js
          node --check site/timeline-clustering.js
          node --check site/timeline-motion.js
          node --check site/timeline-navigation.js
          node --check site/timeline-graph.js
          node --check site/temporal-graph-view.js
          node --check site/timeline-view.js
          node --check site/date-range-picker.js
          node --check site/event-presentation.js
          node --check site/evidence-store.js
          node --check site/sample-case.js
          node --check site/interchange-adapter.js
          node --check site/temporal-standards.js
          node --check site/timeline-migration.js
          node --check site/spatial.js
          node --check site/location-map.js
          node --check site/webmcp.js
          node --check site/memgraph-interchange.js
          node --check site/graph-inference.js
          node --check site/app.js

      - name: Validate application
        run: pnpm test

      - name: Validate static entry point
        run: test -f site/index.html && test -f site/styles.css && test -f site/icon.svg && test -s site/orb-graph.bundle.js && test -s site/evidence-extraction.bundle.js && test -s site/pdf.worker.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
