name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application JavaScript
        run: |
          node --check site/time-scale.js
          node --check site/timeline-clustering.js
          node --check site/timeline-motion.js
          node --check site/timeline-navigation.js
          node --check site/timeline-graph.js
          node --check site/timeline-view.js
          node --check site/date-range-picker.js
          node --check site/event-presentation.js
          node --check site/evidence-store.js
          node --check site/sample-case.js
          node --check site/interchange-adapter.js
          node --check site/temporal-standards.js
          node --check site/spatial.js
          node --check site/location-map.js
          node --check site/app.js

      - name: Validate interchange adapters
        run: node --test tests/interchange-adapter.test.mjs tests/temporal-spatial.test.mjs tests/timeline-interaction.test.mjs tests/event-focus-form.test.mjs tests/evidence-store.test.mjs tests/sample-case.test.mjs tests/timeline-navigation.test.mjs

      - name: Validate static entry point
        run: test -f site/index.html && test -f site/styles.css && test -f site/icon.svg

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
