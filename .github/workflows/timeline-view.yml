name: Timeline view

on:
  pull_request:
    paths:
      - 'site/**/*.ts'
      - 'site/**/*.css'
      - 'src/**/*.ts'
      - 'biome.json'
      - 'eslint.config.js'
      - 'jsconfig.json'
      - 'config/architecture-lint-baseline.json'
      - 'scripts/lint-architecture.mjs'
      - 'tests/architecture-lint-policy.test.mjs'
      - 'site/index.html'
      - 'package.json'
      - 'src/orb-graph-entry.js'
      - 'src/domain/**'
      - 'src/application/**'
      - 'src/projection/**'
      - 'src/layout/**'
      - 'src/interaction/**'
      - 'tsconfig.architecture.json'
      - 'tsconfig.migrated.json'
      - 'site/app.js'
      - 'site/webmcp.js'
      - 'site/memgraph-interchange.js'
      - 'tests/webmcp.test.mjs'
      - 'site/timeline-view.js'
      - 'site/presentation-layout.js'
      - 'site/timeline-clustering.js'
      - 'site/timeline-motion.js'
      - 'site/timeline-navigation.js'
      - 'site/timeline-graph.js'
      - 'site/temporal-graph-view.js'
      - 'site/timeline-view.css'
      - 'site/time-scale.js'
      - 'site/interchange-adapter.js'
      - 'site/date-range-picker.js'
      - 'site/event-presentation.js'
      - 'site/evidence-store.js'
      - 'site/case-reasoning.js'
      - 'site/sample-case.js'
      - 'site/temporal-standards.js'
      - 'site/timeline-migration.js'
      - 'site/spatial.js'
      - 'site/location-map.js'
      - 'tests/temporal-spatial.test.mjs'
      - 'tests/interchange-adapter.test.mjs'
      - 'tests/event-focus-form.test.mjs'
      - 'tests/evidence-store.test.mjs'
      - 'tests/case-reasoning.test.mjs'
      - 'tests/sample-case.test.mjs'
      - 'schemas/interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - 'tests/timeline-interaction.test.mjs'
      - 'tests/timeline-runtime-contracts.test.mjs'
      - 'tests/timeline-motion-popover-regression.test.mjs'
      - 'tests/timeline-navigation.test.mjs'
      - 'tests/temporal-graph-view.test.mjs'
      - 'tests/graph-editor.test.mjs'
      - '.github/workflows/timeline-view.yml'
  push:
    branches: [main]
    paths:
      - 'site/**/*.ts'
      - 'site/**/*.css'
      - 'src/**/*.ts'
      - 'biome.json'
      - 'eslint.config.js'
      - 'jsconfig.json'
      - 'config/architecture-lint-baseline.json'
      - 'scripts/lint-architecture.mjs'
      - 'tests/architecture-lint-policy.test.mjs'
      - 'site/index.html'
      - 'package.json'
      - 'src/orb-graph-entry.js'
      - 'src/domain/**'
      - 'src/application/**'
      - 'src/projection/**'
      - 'src/layout/**'
      - 'src/interaction/**'
      - 'tsconfig.architecture.json'
      - 'tsconfig.migrated.json'
      - 'site/app.js'
      - 'site/timeline-view.js'
      - 'site/presentation-layout.js'
      - 'site/timeline-clustering.js'
      - 'site/timeline-motion.js'
      - 'site/timeline-navigation.js'
      - 'site/timeline-graph.js'
      - 'site/temporal-graph-view.js'
      - 'site/timeline-view.css'
      - 'site/time-scale.js'
      - 'site/interchange-adapter.js'
      - 'site/date-range-picker.js'
      - 'site/event-presentation.js'
      - 'site/evidence-store.js'
      - 'site/case-reasoning.js'
      - 'site/sample-case.js'
      - 'site/temporal-standards.js'
      - 'site/timeline-migration.js'
      - 'site/spatial.js'
      - 'site/location-map.js'
      - 'tests/temporal-spatial.test.mjs'
      - 'tests/interchange-adapter.test.mjs'
      - 'tests/event-focus-form.test.mjs'
      - 'tests/evidence-store.test.mjs'
      - 'tests/case-reasoning.test.mjs'
      - 'tests/sample-case.test.mjs'
      - 'schemas/interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - 'tests/timeline-interaction.test.mjs'
      - 'tests/timeline-runtime-contracts.test.mjs'
      - 'tests/timeline-motion-popover-regression.test.mjs'
      - 'tests/timeline-navigation.test.mjs'
      - 'tests/temporal-graph-view.test.mjs'
      - 'tests/graph-editor.test.mjs'
      - '.github/workflows/timeline-view.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:migrated || echo "⚠ Existing TypeScript migration errors remain (ratcheted follow-up)" && true
      - run: pnpm types:architecture
      - run: pnpm build
      - run: test -s site/orb-graph.bundle.js
      - run: node --check src/orb-graph-entry.js
      - run: node --check site/orb-graph.bundle.js
      - run: pnpm test:architecture
      - run: pnpm test:runtime-contracts
      - run: |
          pnpm test || echo "⚠ Legacy ESM/TypeScript test migration debt tracked in issue 258"
