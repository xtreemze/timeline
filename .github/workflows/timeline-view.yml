name: Timeline view

on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/app.js'
      - 'site/timeline-view.js'
      - 'site/timeline-view.css'
      - 'site/time-scale.js'
      - 'site/time-graphics-adapter.js'
      - 'tests/time-graphics-adapter.test.mjs'
      - 'schemas/time-graphics-interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - '.github/workflows/timeline-view.yml'
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/app.js'
      - 'site/timeline-view.js'
      - 'site/timeline-view.css'
      - 'site/time-scale.js'
      - 'site/time-graphics-adapter.js'
      - 'tests/time-graphics-adapter.test.mjs'
      - 'schemas/time-graphics-interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - '.github/workflows/timeline-view.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check site/time-scale.js
      - run: node --check site/timeline-view.js
      - run: node --check site/time-graphics-adapter.js
      - run: node --check site/app.js
      - run: node --test tests/time-scale.test.mjs tests/timeline-view-geometry.test.mjs tests/time-graphics-adapter.test.mjs
