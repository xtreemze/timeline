name: Timeline view

on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'package.json'
      - 'src/orb-graph-entry.js'
      - 'src/evidence-extraction-core.js'
      - 'src/evidence-extraction-entry.js'
      - 'site/app.js'
      - 'site/webmcp.js'
      - 'site/graph-inference.js'
      - 'site/memgraph-interchange.js'
      - 'tests/webmcp.test.mjs'
      - 'tests/graph-inference.test.mjs'
      - 'site/timeline-view.js'
      - 'site/presentation-layout.js'
      - 'site/timeline-clustering.js'
      - 'site/timeline-motion.js'
      - 'site/timeline-navigation.js'
      - 'site/timeline-graph.js'
      - 'site/temporal-graph-view.js'
      - 'site/timeline-view.css'
      - 'site/styles.css'
      - 'site/time-scale.js'
      - 'site/interchange-adapter.js'
      - 'site/date-range-picker.js'
      - 'site/event-presentation.js'
      - 'site/evidence-store.js'
      - 'site/case-reasoning.js'
      - 'site/sample-case.js'
      - 'site/temporal-standards.js'
      - 'site/timeline-migration.js'
      - 'site/spatial.js'
      - 'site/location-map.js'
      - 'tests/temporal-spatial.test.mjs'
      - 'tests/interchange-adapter.test.mjs'
      - 'tests/event-focus-form.test.mjs'
      - 'tests/evidence-store.test.mjs'
      - 'tests/evidence-extraction.test.mjs'
      - 'tests/case-reasoning.test.mjs'
      - 'tests/sample-case.test.mjs'
      - 'schemas/interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - 'tests/timeline-interaction.test.mjs'
      - 'tests/timeline-navigation.test.mjs'
      - 'tests/temporal-graph-view.test.mjs'
      - 'tests/graph-editor.test.mjs'
      - '.github/workflows/timeline-view.yml'
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'package.json'
      - 'src/orb-graph-entry.js'
      - 'src/evidence-extraction-core.js'
      - 'src/evidence-extraction-entry.js'
      - 'site/app.js'
      - 'site/timeline-view.js'
      - 'site/presentation-layout.js'
      - 'site/timeline-clustering.js'
      - 'site/timeline-motion.js'
      - 'site/timeline-navigation.js'
      - 'site/timeline-graph.js'
      - 'site/temporal-graph-view.js'
      - 'site/timeline-view.css'
      - 'site/styles.css'
      - 'site/time-scale.js'
      - 'site/interchange-adapter.js'
      - 'site/date-range-picker.js'
      - 'site/event-presentation.js'
      - 'site/evidence-store.js'
      - 'site/case-reasoning.js'
      - 'site/sample-case.js'
      - 'site/temporal-standards.js'
      - 'site/timeline-migration.js'
      - 'site/spatial.js'
      - 'site/location-map.js'
      - 'tests/temporal-spatial.test.mjs'
      - 'tests/interchange-adapter.test.mjs'
      - 'tests/event-focus-form.test.mjs'
      - 'tests/evidence-store.test.mjs'
      - 'tests/evidence-extraction.test.mjs'
      - 'tests/case-reasoning.test.mjs'
      - 'tests/sample-case.test.mjs'
      - 'schemas/interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - 'tests/timeline-interaction.test.mjs'
      - 'tests/timeline-navigation.test.mjs'
      - 'tests/temporal-graph-view.test.mjs'
      - 'tests/graph-editor.test.mjs'
      - '.github/workflows/timeline-view.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: test -s site/orb-graph.bundle.js
      - run: test -s site/evidence-extraction.bundle.js
      - run: test -s site/pdf.worker.mjs
      - run: node --check src/orb-graph-entry.js
      - run: node --check src/evidence-extraction-core.js
      - run: node --check src/evidence-extraction-entry.js
      - run: node --check site/orb-graph.bundle.js
      - run: node --check site/evidence-extraction.bundle.js
      - run: node --check site/time-scale.js
      - run: node --check site/timeline-clustering.js
      - run: node --check site/timeline-motion.js
      - run: node --check site/timeline-navigation.js
      - run: node --check site/timeline-graph.js
      - run: node --check site/temporal-graph-view.js
      - run: node --check site/timeline-view.js
      - run: node --check site/presentation-layout.js
      - run: node --check site/date-range-picker.js
      - run: node --check site/event-presentation.js
      - run: node --check site/evidence-store.js
      - run: node --check site/case-reasoning.js
      - run: node --check site/sample-case.js
      - run: node --check site/interchange-adapter.js
      - run: node --check site/temporal-standards.js
      - run: node --check site/timeline-migration.js
      - run: node --check site/spatial.js
      - run: node --check site/location-map.js
      - run: node --check site/graph-inference.js
      - run: node --check site/app.js
      - run: pnpm test
