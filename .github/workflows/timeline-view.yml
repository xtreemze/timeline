name: Timeline view

on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/app.js'
      - 'site/timeline-view.js'
      - 'site/timeline-clustering.js'
      - 'site/timeline-motion.js'
      - 'site/timeline-graph.js'
      - 'site/timeline-view.css'
      - 'site/time-scale.js'
      - 'site/interchange-adapter.js'
      - 'site/date-range-picker.js'
      - 'site/event-presentation.js'
      - 'site/temporal-standards.js'
      - 'site/spatial.js'
      - 'site/location-map.js'
      - 'tests/temporal-spatial.test.mjs'
      - 'tests/interchange-adapter.test.mjs'
      - 'tests/event-focus-form.test.mjs'
      - 'schemas/interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - 'tests/timeline-interaction.test.mjs'
      - '.github/workflows/timeline-view.yml'
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/app.js'
      - 'site/timeline-view.js'
      - 'site/timeline-clustering.js'
      - 'site/timeline-motion.js'
      - 'site/timeline-graph.js'
      - 'site/timeline-view.css'
      - 'site/time-scale.js'
      - 'site/interchange-adapter.js'
      - 'site/date-range-picker.js'
      - 'site/event-presentation.js'
      - 'site/temporal-standards.js'
      - 'site/spatial.js'
      - 'site/location-map.js'
      - 'tests/temporal-spatial.test.mjs'
      - 'tests/interchange-adapter.test.mjs'
      - 'tests/event-focus-form.test.mjs'
      - 'schemas/interchange-v1.schema.json'
      - 'tests/timeline-view-geometry.test.mjs'
      - 'tests/timeline-interaction.test.mjs'
      - '.github/workflows/timeline-view.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check site/time-scale.js
      - run: node --check site/timeline-clustering.js
      - run: node --check site/timeline-motion.js
      - run: node --check site/timeline-graph.js
      - run: node --check site/timeline-view.js
      - run: node --check site/date-range-picker.js
      - run: node --check site/event-presentation.js
      - run: node --check site/interchange-adapter.js
      - run: node --check site/temporal-standards.js
      - run: node --check site/spatial.js
      - run: node --check site/location-map.js
      - run: node --check site/app.js
      - run: node --test tests/time-scale.test.mjs tests/timeline-view-geometry.test.mjs tests/timeline-interaction.test.mjs tests/interchange-adapter.test.mjs tests/temporal-spatial.test.mjs tests/event-focus-form.test.mjs
