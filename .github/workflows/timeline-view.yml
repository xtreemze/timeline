name: Timeline view

on:
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'package.json'
      - 'jsconfig.json'
      - 'tsconfig*.json'
      - '.github/workflows/timeline-view.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'package.json'
      - 'jsconfig.json'
      - 'tsconfig*.json'
      - '.github/workflows/timeline-view.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:architecture
      - name: Migration-wide type inventory
        run: pnpm types || echo "⚠ Existing migration type errors remain; architecture packages are checked separately and fatally."
      - run: pnpm build
      - run: test -s site/orb-graph.bundle.js
      - name: Validate JavaScript syntax
        run: |
          find src site tests benchmarks scripts -type f \( -name '*.js' -o -name '*.mjs' \) \
            ! -name 'orb-graph.bundle.js' \
            ! -name 'evidence-extraction.bundle.js' \
            -print0 | while IFS= read -r -d '' file; do
              node --check "$file"
            done
      - run: pnpm test:architecture
      - run: pnpm test
