name: Finalize PR 531

on:
  push:
    branches:
      - audit/example-story-semantics-2026-09-24
    paths:
      - .github/workflows/finalize-pr-531.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/example-story-semantics-2026-09-24
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Merge current main and resolve graph contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$conflicts" != "site/timeline-graph.ts" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          git checkout --theirs site/timeline-graph.ts
          node <<'NODE'
          const fs = require("node:fs");
          const file = "site/timeline-graph.ts";
          let s = fs.readFileSync(file, "utf8");
          const replace = (from, to, label) => {
            if (!s.includes(from)) throw new Error("Missing merge anchor: " + label);
            s = s.replace(from, to);
          };

          replace(
            'const GRAPH_CONTRACT_VERSION = "2026-09-21.1";\nconst GRAPH_MODEL_RULES = Object.freeze({\n  nodeIdentity: "one-durable-entity",',
            'const GRAPH_CONTRACT_VERSION = "2026-09-24.1";\nconst GRAPH_MODEL_RULES = Object.freeze({\n  nodeIdentity: "one-durable-entity",\n  nodeTypes: "specific-domain-types-no-generic-placeholders",\n  propertyKeys: "lowerCamelCase",',
            "graph contract header",
          );
          replace(
            '  spatiotemporalContext: "relationship.time-and-relationship.placeId",\n  categories: "chronology-items-only",',
            '  spatiotemporalContext: "relationship.time-and-relationship.placeId",\n  referentialIntegrity: "relationship-place-item-source-references-must-resolve",\n  categories: "chronology-items-only",',
            "referential integrity rule",
          );
          replace(
            ']);\n\nconst ENTITY_CONTEXT_KEYS = new Set([',
            ']);\n\nconst GENERIC_ENTITY_NODE_TYPES = new Set([\n  "entity",\n  "object",\n  "thing",\n  "item",\n  "resource",\n  "agent",\n]);\n\nconst PROPERTY_KEY_PATTERN = /^[a-z][A-Za-z0-9]*$/;\n\nconst ENTITY_CONTEXT_KEYS = new Set([',
            "generic entity types",
          );
          replace(
            '  const name = text(raw?.name || raw?.label || raw?.title, 180);\n  const type = text(raw?.type, 60) || "entity";\n  const typeKey = semanticKey(type);\n  if (NON_ENTITY_NODE_TYPES.has(typeKey)) {',
            '  const name = text(raw?.name || raw?.label || raw?.title, 180);\n  const type = text(raw?.type, 60);\n  const typeKey = semanticKey(type);\n  if (!name) return { valid: false, message: "An entity name is required." };\n  if (!type) return { valid: false, message: "A specific entity type is required." };\n  if (GENERIC_ENTITY_NODE_TYPES.has(typeKey)) {\n    return {\n      valid: false,\n      message: `"${type}" is too generic for a canonical entity type. Use a domain type such as person, organization, dwelling, vehicle, document, garment, food, or buildingMaterial.`,\n    };\n  }\n  if (NON_ENTITY_NODE_TYPES.has(typeKey)) {',
            "entity validation",
          );
          replace(
            '  if (attributes && typeof attributes === "object" && !Array.isArray(attributes)) {\n    const invalidKey = Object.keys(attributes).find((key) =>',
            '  if (attributes && typeof attributes === "object" && !Array.isArray(attributes)) {\n    const nonCanonicalKey = Object.keys(attributes).find((key) => !PROPERTY_KEY_PATTERN.test(key));\n    if (nonCanonicalKey) {\n      return {\n        valid: false,\n        message: `Node property "${nonCanonicalKey}" must use lowerCamelCase.`,\n      };\n    }\n    const invalidKey = Object.keys(attributes).find((key) =>',
            "entity property naming",
          );
          replace(
            '    type: text(raw.type, 60) || "entity",',
            '    type: text(raw.type, 60),',
            "normalized entity type",
          );
          replace(
            '  const rawStories = Array.isArray(input?.stories) ? input.stories : [];\n  const rawPlaces = Array.isArray(input?.places) ? input.places : [];\n  const entityIds = new Set<string>();',
            '  const rawStories = Array.isArray(input?.stories) ? input.stories : [];\n  const rawPlaces = Array.isArray(input?.places) ? input.places : [];\n  const rawEvidence = Array.isArray(input?.evidence) ? input.evidence : [];\n  const itemIds = new Set<string>();\n  const evidenceIds = new Set<string>();\n  const entityIds = new Set<string>();',
            "validation indexes",
          );
          replace(
            '  rawItems.forEach((item, index) => {\n    registerId(item?.id, `chronology item ${index + 1}`, `Chronology item ${index + 1}`);\n  });\n  rawStories.forEach((story, index) => {',
            '  rawItems.forEach((item, index) => {\n    const id = registerId(item?.id, `chronology item ${index + 1}`, `Chronology item ${index + 1}`);\n    if (id) itemIds.add(id);\n  });\n  rawEvidence.forEach((record, index) => {\n    const id = registerId(record?.id, `evidence record ${index + 1}`, `Evidence record ${index + 1}`);\n    if (id) evidenceIds.add(id);\n  });\n  for (const item of rawItems) {\n    for (const sourceId of textList(item?.evidenceIds, { maxItems: 96, maxLength: 120 })) {\n      if (!evidenceIds.has(sourceId)) {\n        errors.push(\n          `Chronology item ${text(item?.id, 120) || "unknown"}: evidenceId "${sourceId}" must reference an evidence record.`,\n        );\n      }\n    }\n  }\n  rawStories.forEach((story, index) => {',
            "item and evidence registration",
          );
          replace(
            '    if (!normalized?.geometry) {\n      errors.push(\n        `${label}: canonical place requires Point coordinates or Polygon/MultiPolygon area geometry.`,\n      );\n    }\n  });',
            '    if (!normalized?.geometry) {\n      errors.push(\n        `${label}: canonical place requires Point coordinates or Polygon/MultiPolygon area geometry.`,\n      );\n    }\n    const attrs = raw?.attributes;\n    if (attrs && typeof attrs === "object" && !Array.isArray(attrs)) {\n      const badKey = Object.keys(attrs).find((key) => !PROPERTY_KEY_PATTERN.test(key));\n      if (badKey) errors.push(`${label}: place attribute "${badKey}" must use lowerCamelCase.`);\n    }\n  });',
            "place attributes",
          );
          replace(
            '    const result = validateEntityNode(raw);\n    if (!result.valid) errors.push(`${label}: ${result.message}`);\n    const taxonomyKeys = graphTaxonomyKeys(raw);',
            '    const result = validateEntityNode(raw);\n    if (!result.valid) errors.push(`${label}: ${result.message}`);\n    for (const sourceId of textList(raw?.sourceIds, { maxItems: 96, maxLength: 120 })) {\n      if (!evidenceIds.has(sourceId))\n        errors.push(`${label}: sourceId "${sourceId}" must reference an evidence record.`);\n    }\n    const taxonomyKeys = graphTaxonomyKeys(raw);',
            "entity provenance",
          );
          replace(
            '    if (!entityIds.has(objectId))\n      errors.push(`${label}: object/target must reference an entity node.`);\n  });',
            '    if (!entityIds.has(objectId))\n      errors.push(`${label}: object/target must reference an entity node.`);\n\n    const placeId = text(raw.placeId || raw.locationId, 120);\n    if (placeId && !placeIds.has(placeId)) {\n      errors.push(`${label}: placeId "${placeId}" must reference a canonical place.`);\n    }\n    for (const itemId of textList(raw.itemIds || raw.contextItemIds || raw.eventIds, {\n      maxItems: 96,\n      maxLength: 120,\n    })) {\n      if (!itemIds.has(itemId))\n        errors.push(`${label}: itemId "${itemId}" must reference a chronology item.`);\n    }\n    for (const sourceId of textList(raw.sourceIds, { maxItems: 96, maxLength: 120 })) {\n      if (!evidenceIds.has(sourceId))\n        errors.push(`${label}: sourceId "${sourceId}" must reference an evidence record.`);\n    }\n    const attributes = raw.attributes || raw.properties;\n    if (attributes && typeof attributes === "object" && !Array.isArray(attributes)) {\n      const badKey = Object.keys(attributes).find((key) => !PROPERTY_KEY_PATTERN.test(key));\n      if (badKey)\n        errors.push(`${label}: relationship property "${badKey}" must use lowerCamelCase.`);\n      const contextKey = Object.keys(attributes).find(contextPropertyKey);\n      if (contextKey)\n        errors.push(\n          `${label}: relationship property "${contextKey}" is spatiotemporal context; use time/placeId.`,\n        );\n    }\n  });',
            "relationship integrity",
          );
          fs.writeFileSync(file, s);
          NODE
          git add site/timeline-graph.ts
          git commit --no-edit
      - run: pnpm install --frozen-lockfile
      - name: Repair strict ProjectRepository record typing
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "src/application/project-repository.ts";
          let s = fs.readFileSync(file, "utf8");
          const anchor = 'function isRecord(value: unknown): value is Record<string, unknown> {';
          if (!s.includes(anchor)) throw new Error("ProjectRepository record type anchor not found");
          const replacement = `interface PersistedRecord extends Record<string, unknown> {
            readonly alternateNames?: unknown;
            readonly attributes?: unknown;
            readonly confidence?: unknown;
            readonly entities?: unknown;
            readonly format?: unknown;
            readonly id?: unknown;
            readonly itemIds?: unknown;
            readonly name?: unknown;
            readonly objectId?: unknown;
            readonly placeId?: unknown;
            readonly predicate?: unknown;
            readonly project?: unknown;
            readonly projectKey?: unknown;
            readonly relationships?: unknown;
            readonly revision?: unknown;
            readonly role?: unknown;
            readonly savedAt?: unknown;
            readonly schemaVersion?: unknown;
            readonly sourceIds?: unknown;
            readonly subjectId?: unknown;
            readonly time?: unknown;
            readonly type?: unknown;
          }

          function isRecord(value: unknown): value is PersistedRecord {`;
          s = s.replace(anchor, replacement);
          const optionalFields = '    role: typeof value.role === "string" ? value.role : undefined,\\n    placeId: typeof value.placeId === "string" ? placeId(value.placeId) : undefined,';
          if (!s.includes(optionalFields)) throw new Error("ProjectRepository optional field anchor not found");
          s = s.replace(
            optionalFields,
            '    ...(typeof value.role === "string" ? { role: value.role } : {}),\\n    ...(typeof value.placeId === "string" ? { placeId: placeId(value.placeId) } : {}),',
          );
          fs.writeFileSync(file, s);
          NODE
      - name: Apply Biome fixes to PR-owned files
        run: >
          pnpm exec biome check --write
          site/event-presentation.ts
          site/graph-inference.ts
          site/sample-case.ts
          site/spatial.ts
          site/timeline-graph.ts
          src/domain/entity.ts
          src/orb-graph-entry.js
          tests/domain-kernel.test.mjs
          tests/sample-case.test.mjs
          src/application/project-repository.ts
      - run: pnpm check:quality
      - run: pnpm types:migrated
      - run: pnpm types:architecture
      - run: pnpm test:architecture
      - run: pnpm test
      - name: Commit finalized branch
        run: |
          rm .github/workflows/finalize-pr-531.yml
          git add -A
          git commit -m "chore: finalize #531 against main" || true
          git push origin HEAD:audit/example-story-semantics-2026-09-24
