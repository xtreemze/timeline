name: Temporary force formatter

on:
  push:
    branches:
      - perf/force-rendering-interactions

permissions:
  contents: read

jobs:
  format-force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Emit formatted force solver
        run: |
          pnpm exec biome format --write src/layout/reference-world-force-simulation.ts
          echo '<<<FORMATTED_FORCE_SOLVER>>>'
          cat src/layout/reference-world-force-simulation.ts
          echo '<<<END_FORMATTED_FORCE_SOLVER>>>'
